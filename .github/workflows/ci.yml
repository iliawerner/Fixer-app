name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      # Pin the complete commit instead of trusting a mutable major-version ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The app icon is an Icon Composer `fixer.icon`, which needs Xcode 26+.
      # Select the newest Xcode installed on the runner.
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Versions
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Icon Composer (`fixer.icon`) rendering crashes actool on the headless CI
      # runner (broken media pipeline). The icon is a packaging asset, irrelevant
      # to building and running the tests, so strip it from the project for CI only.
      # (macOS runner → BSD sed, hence the `-i ''`.)
      - name: Strip Icon Composer icon (CI build only)
        run: |
          sed -i '' '/- path: fixer.icon/,+1d' project.yml
          sed -i '' '/ASSETCATALOG_COMPILER_APPICON_NAME/d' project.yml

      - name: Generate Xcode project
        run: ./scripts/generate-project.sh

      # Hosted AppKit windows are not deterministic on the headless macOS 15
      # runner. Pixel rendering can return a transparent bitmap, and the test
      # host can crash during teardown after the window tests have passed. These
      # suites remain mandatory in the local macOS 26 release gate documented
      # in docs/RELEASING.md.
      - name: Build & test deterministic suites
        run: >
          xcodebuild test
          -project Fixer.xcodeproj
          -scheme Fixer
          -destination 'platform=macOS'
          -disableAutomaticPackageResolution
          -onlyUsePackageVersionsFromResolvedFile
          -skip-testing:FixerTests/V2PreviewRenderingTests
          -skip-testing:FixerTests/WorkspaceWindowFactoryTests
          -skip-testing:FixerTests/HistoryWindowLifecycleTests
          CODE_SIGN_IDENTITY=-

      # Tests use Debug by design. Build Release separately so the hardened
      # runtime, entitlement injection, optimization and universal binary stay
      # covered by CI as release-only settings evolve.
      - name: Build locked Release
        run: >
          xcodebuild build
          -project Fixer.xcodeproj
          -scheme Fixer
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/FixerRelease"
          -disableAutomaticPackageResolution
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGN_IDENTITY=-

      - name: Verify Release metadata and security boundary
        run: |
          app="$RUNNER_TEMP/FixerRelease/Build/Products/Release/fixer.app"
          plist="$app/Contents/Info.plist"
          executable="$app/Contents/MacOS/fixer"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "0.2.2"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "4"

          archs="$(lipo -archs "$executable")"
          case " $archs " in *" arm64 "*) ;; *) exit 1 ;; esac
          case " $archs " in *" x86_64 "*) ;; *) exit 1 ;; esac

          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dvvv "$app" 2>&1)"
          case "$signature" in *"runtime"*) ;; *) exit 1 ;; esac

          entitlements="$(codesign -d --entitlements - "$app" 2>&1)"
          case "$entitlements" in *"com.apple.security.device.audio-input"*) ;; *) exit 1 ;; esac
          case "$entitlements" in *"com.apple.security.get-task-allow"*) exit 1 ;; esac
